<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Work Finder - Login</title>
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Header section with forest green background & custom logo -->
            <div class="login-header">
                <!-- Decorative background circles -->
                <div class="decoration-circle circle-1"></div>
                <div class="decoration-circle circle-2"></div>

                <div class="header-content">
                    <!-- Custom Logo -->
                    <div class="logo-container">
                        <svg class="logo-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="32" cy="32" r="30" fill="#2E7D32" opacity="0.15"/>
                            <!-- Leaf & Community People Motif -->
                            <path d="M32 10C22 10 14 18 14 28C14 38 22 46 32 54C42 46 50 38 50 28C50 18 42 10 32 10Z" fill="#2E7D32"/>
                            <path d="M32 14C24 14 18 20 18 28C18 34 22 40 28 44V50C28 51.1 28.9 52 30 52H34C35.1 52 36 51.1 36 50V44C42 40 46 34 46 28C46 20 40 14 32 14Z" fill="#E8F5E9"/>
                            <!-- Handshake / Connected People Vector -->
                            <circle cx="26" cy="26" r="4" fill="#1B5E20"/>
                            <circle cx="38" cy="26" r="4" fill="#1B5E20"/>
                            <path d="M22 38C22 34 25 32 29 32H35C39 32 42 34 42 38V40H22V38Z" fill="#1B5E20"/>
                        </svg>
                    </div>

                    <span class="welcome-badge">Welcome Back</span>
                    <h1 class="header-title">Hello! <span class="wave-emoji">👋</span></h1>
                    <p class="header-subtitle">Community Work Finder</p>
                </div>
            </div>

            <!-- Form body -->
            <div class="login-body">
                <form id="loginForm" onsubmit="handleLogin(event)">
                    
                    <!-- Email field -->
                    <div class="form-group">
                        <label class="form-label" for="username">Email or Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
                            </span>
                            <input type="text" id="username" required placeholder="e.g., arvee.salazar@email.com" class="form-input">
                        </div>
                    </div>

                    <!-- Password field -->
                    <div class="form-group">
                        <div class="label-row">
                            <label class="form-label" for="password">Password</label>
                            <a href="#forgot" onclick="showModal('Forgot Password', 'Password reset instructions have been sent to your email.')" class="forgot-link">Forgot?</a>
                        </div>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                            </span>
                            <input type="password" id="password" required placeholder="••••••••" class="form-input">
                            <button type="button" onclick="togglePassword()" class="password-toggle" id="eyeIconBtn">
                                <svg id="eyeIcon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me -->
                    <div class="remember-row">
                        <label class="checkbox-label">
                            <input type="checkbox" class="custom-checkbox">
                            <span class="checkbox-text">Remember me</span>
                        </label>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="submit-btn">
                        <span>Log In</span>
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </form>

                <!-- Divider -->
                <div class="divider-container">
                    <span class="divider-text">or continue with</span>
                </div>

                <!-- Social Login Buttons -->
                <div class="social-grid">
                    <button onclick="showModal('Social Login', 'Google authentication is ready to integrate.')" class="social-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.8 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.6 6.4C.6 8.4 0 10.7 0 13s.6 4.6 1.6 6.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.2 0-5.8-2.1-6.7-5.3L1.6 15.9C3.5 19.7 7.4 23 12 23z"/></svg>
                        Google
                    </button>
                    <button onclick="showModal('Social Login', 'Facebook authentication is ready to integrate.')" class="social-btn">
                        <svg width="16" height="16" fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                        Facebook
                    </button>
                </div>

                <!-- Sign up prompt -->
                <p class="signup-prompt">
                    Don't have an account yet? 
                    <a href="#signup" onclick="showModal('Sign Up', 'Redirecting to Community Work Finder registration...')" class="signup-link">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Custom Modal Message Box (No alert()) -->
    <div id="messageModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon-wrap">✨</div>
            <h3 id="modalTitle" class="modal-title">Notice</h3>
            <p id="modalDesc" class="modal-desc">Message goes here</p>
            <button onclick="closeModal()" class="modal-btn">Got it</button>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m14.41 14.41l-3.59-3.59"/>';
            } else {
                pwdInput.type = 'password';
                eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            showModal('Login Successful', `Welcome back, ${username}! Redirecting to Community Work Finder dashboard...`);
        }

        function showModal(title, description) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = description;
            const modal = document.getElementById('messageModal');
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('messageModal');
            modal.classList.remove('active');
        }
    </script>
</body>
</html>
