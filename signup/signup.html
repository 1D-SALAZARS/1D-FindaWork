<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sign Up - Community Work Finder</title>
  
  <!-- Custom CSS stylesheet -->
  <link rel="stylesheet" href="signup.css" />
  
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <main class="app-container">
    <div class="signup-card">
      
      <!-- Brand Header -->
      <header class="brand-header">
        <div class="brand-icon-wrapper">
          <i class="ph-bold ph-handshake"></i>
        </div>
        <h1 class="brand-title">Create Account</h1>
        <p class="brand-subtitle">Join community workers & employers today</p>
      </header>

      <form class="signup-form" onsubmit="event.preventDefault(); alert('Account created successfully!');">
        
        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label" for="fullname">Full Name</label>
          <div class="input-wrapper">
            <i class="ph-bold ph-user input-icon"></i>
            <input type="text" id="fullname" class="form-input" placeholder="e.g. Maria Santos" required />
          </div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="ph-bold ph-envelope-simple input-icon"></i>
            <input type="email" id="email" class="form-input" placeholder="name@example.ph" required />
          </div>
        </div>

        <!-- Phone Number (+63 / 09XX) -->
        <div class="form-group">
          <label class="form-label" for="phone">Phone Number</label>
          <div class="phone-group">
            <span class="country-code">+63</span>
            <div class="input-wrapper" style="flex: 1;">
              <i class="ph-bold ph-phone input-icon"></i>
              <input type="tel" id="phone" class="form-input phone-input" placeholder="917 123 4567" pattern="[0-9]{10}" maxLength="10" required />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">I want to...</label>
          <div class="role-selection">
            <label class="role-card">
              <input type="radio" name="role" value="worker" checked />
              <i class="ph-bold ph-briefcase role-icon"></i>
              <span class="role-title">Find Work</span>
            </label>
            <label class="role-card">
              <input type="radio" name="role" value="employer" />
              <i class="ph-bold ph-user-plus role-icon"></i>
              <span class="role-title">Hire Helpers</span>
            </label>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <i class="ph-bold ph-lock-key input-icon"></i>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required />
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
              <i class="ph-bold ph-eye"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <i class="ph-bold ph-lock-key-open input-icon"></i>
            <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required />
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm-password', this)" aria-label="Toggle password visibility">
              <i class="ph-bold ph-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          Create Account <i class="ph-bold ph-arrow-right"></i>
        </button>
      </form>

      <!-- Footer Link -->
      <p class="footer-text">
        Already have an account? <a href="#" class="login-link">Log In</a>
      </p>

    </div>
  </main>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'ph-bold ph-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'ph-bold ph-eye';
      }
    }
  </script>
</body>
</html>
