<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Community Work Finder</title>
  <link rel="stylesheet" href="profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-frame">
    <!-- Header -->
    <header class="app-header">
      <h1 class="header-title">My Profile</h1>
    </header>

    <main class="main-content">
      <!-- Profile Header Info -->
      <div class="profile-card">
        <div class="profile-avatar">
          <i class="fa-solid fa-user"></i>
        </div>
        <h2 class="profile-name">juan dela cruz</h2>
        <p class="profile-contact"><i class="fa-solid fa-phone"></i> 0912 345 6789</p>
        <p class="profile-contact"><i class="fa-regular fa-envelope"></i> juandelacruz@email.com</p>
      </div>

      <!-- My Skills Section -->
      <div class="section-block">
        <div class="section-header">
          <h3 class="section-title">My Skills</h3>
          <a href="#" class="edit-btn">Edit</a>
        </div>
        <div class="skills-tags">
          <span class="skill-tag">Cleaning</span>
          <span class="skill-tag">Gardening</span>
          <span class="skill-tag">Carpentry</span>
          <span class="skill-tag">Painting</span>
        </div>
      </div>

      <!-- Quick Action Options List -->
      <div class="options-list">
        <div class="option-item">
          <div class="option-label"><i class="fa-regular fa-file-lines option-icon"></i> My Applications</div>
          <i class="fa-solid fa-chevron-right option-arrow"></i>
        </div>
        <div class="option-item">
          <div class="option-label"><i class="fa-regular fa-calendar-check option-icon"></i> Jobs Posted</div>
          <i class="fa-solid fa-chevron-right option-arrow"></i>
        </div>
        <div class="option-item">
          <div class="option-label"><i class="fa-regular fa-heart option-icon"></i> Saved Jobs</div>
          <i class="fa-solid fa-chevron-right option-arrow"></i>
        </div>
        <div class="option-item">
          <div class="option-label"><i class="fa-solid fa-gear option-icon"></i> Settings</div>
          <i class="fa-solid fa-chevron-right option-arrow"></i>
        </div>
        <div class="option-item">
          <div class="option-label"><i class="fa-solid fa-arrow-right-from-bracket option-icon"></i> Log Out</div>
          <i class="fa-solid fa-chevron-right option-arrow"></i>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="find-jobs.html" class="nav-item">
        <i class="fa-solid fa-briefcase"></i>
        <span>Jobs</span>
      </a>
      <a href="post-job.html" class="nav-item add-btn-item">
        <div class="add-circle"><i class="fa-solid fa-plus"></i></div>
      </a>
      <a href="messages.html" class="nav-item">
        <i class="fa-regular fa-comment-dots"></i>
        <span>Messages</span>
      </a>
      <a href="profile.html" class="nav-item active">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
  </div>
</body>
</html>
