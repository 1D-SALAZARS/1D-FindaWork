<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Community Work Finder</title>
  <link rel="stylesheet" href="messages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-frame">
    <!-- Header -->
    <header class="app-header">
      <h1 class="header-title">Messages</h1>
    </header>

    <main class="main-content">
      <div class="chat-list">
        <!-- Message 1 -->
        <div class="chat-item">
          <div class="avatar yellow-bg"><i class="fa-solid fa-user"></i></div>
          <div class="chat-body">
            <div class="chat-header">
              <span class="user-name">Maria Santos</span>
              <span class="chat-time">9:30 AM</span>
            </div>
            <p class="chat-preview">Hi! Are you still available?</p>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </div>

        <!-- Message 2 -->
        <div class="chat-item">
          <div class="avatar blue-bg"><i class="fa-solid fa-user"></i></div>
          <div class="chat-body">
            <div class="chat-header">
              <span class="user-name">Juan Dela Cruz</span>
              <span class="chat-time">Yesterday</span>
            </div>
            <p class="chat-preview">Thank you!</p>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </div>

        <!-- Message 3 -->
        <div class="chat-item">
          <div class="avatar orange-bg"><i class="fa-solid fa-user"></i></div>
          <div class="chat-body">
            <div class="chat-header">
              <span class="user-name">Ana Reyes</span>
              <span class="chat-time">May 17</span>
            </div>
            <p class="chat-preview">When can you start?</p>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </div>

        <!-- Message 4 -->
        <div class="chat-item">
          <div class="avatar green-bg"><i class="fa-solid fa-user"></i></div>
          <div class="chat-body">
            <div class="chat-header">
              <span class="user-name">Pedro Gomez</span>
              <span class="chat-time">May 16</span>
            </div>
            <p class="chat-preview">Okay, see you then.</p>
          </div>
          <i class="fa-solid fa-chevron-right arrow-icon"></i>
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="find-jobs.html" class="nav-item">
        <i class="fa-solid fa-briefcase"></i>
        <span>Jobs</span>
      </a>
      <a href="post-job.html" class="nav-item add-btn-item">
        <div class="add-circle"><i class="fa-solid fa-plus"></i></div>
      </a>
      <a href="messages.html" class="nav-item active">
        <i class="fa-regular fa-comment-dots"></i>
        <span>Messages</span>
      </a>
      <a href="profile.html" class="nav-item">
        <i class="fa-regular fa-user"></i>
        <span>Profile</span>
      </a>
    </nav>
  </div>
</body>
</html>
